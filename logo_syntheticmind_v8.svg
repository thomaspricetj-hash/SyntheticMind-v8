<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (optional, remove if you want transparent) -->
  <rect x="0" y="0" width="480" height="160" fill="#05060A"/>

  <!-- Neural core circle -->
  <circle cx="80" cy="80" r="46" fill="#0B1020" stroke="#FF3344" stroke-width="2"/>

  <!-- Radial connection lines -->
  <g stroke="#FF3344" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="34" x2="80" y2="16"/>
    <line x1="80" y1="126" x2="80" y2="144"/>
    <line x1="34" y1="80" x2="16" y2="80"/>
    <line x1="126" y1="80" x2="144" y2="80"/>

    <line x1="52" y1="52" x2="38" y2="38"/>
    <line x1="108" y1="52" x2="122" y2="38"/>
    <line x1="52" y1="108" x2="38" y2="122"/>
    <line x1="108" y1="108" x2="122" y2="122"/>
  </g>

  <!-- Inner neural nodes -->
  <g fill="#FF3344">
    <circle cx="80" cy="52" r="4"/>
    <circle cx="80" cy="108" r="4"/>
    <circle cx="52" cy="80" r="4"/>
    <circle cx="108" cy="80" r="4"/>
    <circle cx="64" cy="64" r="3.5"/>
    <circle cx="96" cy="64" r="3.5"/>
    <circle cx="64" cy="96" r="3.5"/>
    <circle cx="96" cy="96" r="3.5"/>
  </g>

  <!-- Inner connections -->
  <g stroke="#FF3344" stroke-width="1.4" stroke-linecap="round">
    <line x1="64" y1="64" x2="96" y2="64"/>
    <line x1="64" y1="96" x2="96" y2="96"/>
    <line x1="64" y1="64" x2="64" y2="96"/>
    <line x1="96" y1="64" x2="96" y2="96"/>

    <line x1="80" y1="52" x2="64" y2="64"/>
    <line x1="80" y1="52" x2="96" y2="64"/>
    <line x1="80" y1="108" x2="64" y2="96"/>
    <line x1="80" y1="108" x2="96" y2="96"/>
  </g>

  <!-- Text: SyntheticMind -->
  <text x="180" y="72"
        font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="32"
        fill="#FFFFFF"
        letter-spacing="1.5">
    SyntheticMind
  </text>

  <!-- Text: v8 badge -->
  <rect x="180" y="88" rx="6" ry="6" width="78" height="28" fill="#FF3344" opacity="0.9"/>
  <text x="192" y="108"
        font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="16"
        fill="#FFFFFF"
        font-weight="600">
    v8 CORE
  </text>

  <!-- Subtitle -->
  <text x="270" y="108"
        font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="14"
        fill="#A0A4B8"
        letter-spacing="1">
    COGNITIVE AI SYSTEM
  </text>
</svg>
