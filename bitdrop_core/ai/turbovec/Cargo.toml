[package]
name = "turbovec"
version = "0.1.0"
edition = "2021"

[lib]
name = "turbovec"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
bytemuck = "1.14"
faer = "0.20"

# Required by codebook.rs and encode.rs
statrs = "0.16"

# Required by encode.rs and search.rs
rayon = "1.8"

# Required by rotation.rs
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

# Required by encode.rs
ndarray = "0.15"

# Required by encode.rs and search.rs for SIMD dispatch
cfg-if = "1.0"
